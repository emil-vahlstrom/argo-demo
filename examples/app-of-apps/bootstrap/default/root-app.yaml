apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    path: examples/app-of-apps/argoapps/default
    repoURL: git@github.com:emil-vahlstrom/argo-demo.git
    targetRevision: master
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      enabled: true